<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honesty Beaton | Portfolio</title>
    <link rel="stylesheet" href="style.css">
     <!-- Embedded Style Sheet-->
      <style>
   

.contact-page {
    width: min(700px, 90vw);
    margin: 0 auto;
    padding: 60px 0;
    text-align: center;
}

.contact-page h1 {
    font-family: "DM Serif Display", serif;
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 400;
    letter-spacing: -0.04em;
    color: var(--pink);
    margin: 0 0 10px;
}

.contact-page h2 {
    font-family: "DM Serif Display", serif;
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 400;
    color: var(--brown);
    margin: 0 0 35px;
}


/* =========================
   CONTACT FORM
   ========================= */

.contact-page form {
    width: 100%;
    box-sizing: border-box;
    background: #fff;
    color: var(--dark);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    text-align: left;
}

.contact-page form p {
    color: var(--pink);
    margin: 0 0 20px;
    font-size: 0.9rem;
}


/* =========================
   LABELS
   ========================= */

.contact-page label {
    display: block;
    color: var(--pink);
    margin-bottom: 8px;
    font-weight: bold;
    font-size: 0.95rem;
}


/* =========================
   INPUTS
   ========================= */

.contact-page input,
.contact-page textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    margin-bottom: 18px;

    border: 1px solid var(--pink);
    border-radius: 6px;

    background: #fff;
    color: var(--dark);

    font-family: "Inter", sans-serif;
    font-size: 0.95rem;

    outline: none;
}

.contact-page textarea {
    resize: vertical;
    min-height: 120px;
}


/* Input focus */

.contact-page input:focus,
.contact-page textarea:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 2px rgba(151, 151, 106, 0.15);
}


/* =========================
   BUTTON
   ========================= */

.contact-page button {
    display: inline-block;

    background: var(--light-pink);
    color: #fff;

    padding: 11px 20px;

    border: none;
    border-radius: 20px;

    font-family: "Inter", sans-serif;
    font-size: 0.9rem;

    cursor: pointer;

    transition: background 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;
}

.contact-page button:hover {
    background: var(--pink);
    transform: translateY(-2px);
}


/* =========================
   FOOTER
   ========================= */

footer {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 30px clamp(10px, 3vw, 30px);

    box-sizing: border-box;

    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
}

.foot-left {
    grid-column: 1;
    text-align: left;
    margin: 0;
}

.foot-right {
    grid-column: 3;
    text-align: right;
    margin: 0;
}

footer a {
    color: var(--brown);
    text-decoration: none;

    transition: color 0.25s ease;
}

footer a:hover {
    color: var(--pink);
}


/* =========================
   PAGE LAYOUT
   ========================= */

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

main {
    flex: 1;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 750px) {

    .contact-page {
        width: 90vw;
        padding: 40px 0;
    }

    .contact-page h1 {
        font-size: clamp(2.8rem, 12vw, 5rem);
    }

    .contact-page h2 {
        font-size: 1.5rem;
        margin-bottom: 25px;
    }

    .contact-page form {
        padding: 25px;
        border-radius: 18px;
    }
}


/* =========================
   SMALL MOBILE
   ========================= */

@media (max-width: 600px) {

    .contact-page {
        width: 90vw;
        padding: 30px 0;
    }

    .contact-page form {
        padding: 20px;
    }

    .contact-page h1 {
        font-size: clamp(2.5rem, 14vw, 4rem);
    }

    .contact-page h2 {
        font-size: 1.3rem;
    }

    footer {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 25px 10px;
    }

    .foot-left,
    .foot-right {
        grid-column: auto;
        text-align: center;
    }
}
</style>
</head>
<body>
    <!-- Botanical Border-->
    <div class="botanical-border">
        <span class="branch branch-top-left"><img src="./images/leaf.png"></span>
        <span class="branch branch-top-right"><img src="./images/leaf.png"></span>
        <span class="branch branch-bottom-left"><img src="./images/leaf.png"></span>
        <span class="branch branch-bottom-right"><img src="./images/leaf.png"></span>
    </div>

    <!-- Falling Petals-->
    <div id="petals"></div>

    <header class="navbar">

        <nav class="nav-left">
            <a href="index.html">/index/</a>
            <a href="projects.html">/projects/</a>
        </nav>

        <a href="index.html" class="logo">
            🌸
        </a>

        <nav class="nav-right">
            <a href="about.html">/about me/</a>
            <a href="contact.html">/contact/</a>
        </nav>

    </header>

    <main>
        <section class="contact-page">
            <h1>/contact me/</h1>
            <h2>let's grow something </h2>
            
            <form action="https://formspree.io/f/mvkgzabv" method="POST">
                    <p>All fields marked with * are required</p>
                    <label for="name">Name*</label>
                    <input type="text" id="name" name="name" required>
    
                    <label for="email">Email*</label>
                    <input type="email" id="email" name="email" required>
                   
               
                    <input type="hidden" name="subject" value="Portfolio Contact Form">
    
                    <label for="message">Message*</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
    
                    <button type="submit">send message →</button>
                </form>
        </section>
        <footer>
            <p class="foot-left">Honesty Beaton</p>
            <p class="foot-right"><a href="mailto:hbeaton@mail.fhsu.edu">h_beaton@mail.fhsu.edu</a></p>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
